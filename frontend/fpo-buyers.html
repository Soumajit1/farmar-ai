<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Buyer Connections — FPO — AgriLink AI</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="stylesheet"
    href="css/dashboards.css"
>

<script src="https://unpkg.com/lucide@latest"></script>


<style>

.buyer-crm-card {

    background:white;

    border:1px solid #eee;

    border-radius:12px;

    padding:24px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.05);

}


.buyer-avatar {

    width:48px;

    height:48px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--color-primary),
            var(--color-accent)
        );

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:20px;

    font-weight:700;

    margin-bottom:12px;

}

</style>

</head>


<body>


<div class="dashboard-layout">


    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">

                <i data-lucide="tractor"></i>

                AgriLink AI

            </div>

        </div>


        <nav class="nav-menu">

            <a
                href="dashboard-fpo.html"
                class="nav-item"
            >
                FPO Overview
            </a>

            <a
                href="fpo-members.html"
                class="nav-item"
            >
                Member Farmers
            </a>

            <a
                href="fpo-inventory.html"
                class="nav-item"
            >
                Aggregated Produce
            </a>

            <a
                href="fpo-buyers.html"
                class="nav-item active"
            >
                Buyer Connections
            </a>

            <a
                href="fpo-transactions.html"
                class="nav-item"
            >
                Transactions
            </a>

            <a
                href="fpo-analytics.html"
                class="nav-item"
            >
                Analytics
            </a>

        </nav>


        <div class="sidebar-footer">

            <a
                href="index.html"
                class="nav-item"
                style="
                    color:#e74c3c;
                    padding:0;
                "
            >
                Log Out
            </a>

        </div>

    </aside>



    <main class="main-content">


        <header class="topbar glass-panel">

            <h2 class="page-title">
                Buyer Connections
            </h2>


            <div class="user-profile">

                <div
                    class="avatar"
                    id="userAvatar"
                >
                    F
                </div>

                <span
                    id="userName"
                    style="font-weight:500;"
                >
                    FPO Admin
                </span>

            </div>

        </header>



        <div class="dashboard-container fade-in">


            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    margin-bottom:24px;
                    flex-wrap:wrap;
                    gap:12px;
                "
            >

                <h3
                    style="
                        font-family:'Outfit',sans-serif;
                    "
                >
                    Buyer Connections
                </h3>


                <input
                    id="buyerSearch"
                    type="text"
                    placeholder="Search buyers..."
                    style="
                        padding:10px 14px;
                        border:1px solid #e0e0e0;
                        border-radius:8px;
                        min-width:200px;
                    "
                >

            </div>



            <div
                class="grid-cards"
                id="buyersGrid"
            >

                <div
                    class="buyer-crm-card"
                >

                    Loading buyers...

                </div>

            </div>


        </div>

    </main>

</div>



<script
    src="js/fpo.js?v=1"
></script>


<script>

if (window.lucide) {
    lucide.createIcons();
}

</script>


</body>

</html>
