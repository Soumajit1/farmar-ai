<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logistics — AgriLink AI</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboards.css">

<script src="https://unpkg.com/lucide@latest"></script>

<style>

.shipment-card {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.progress-track {
    height: 6px;
    background: #e8f5e9;
    border-radius: 3px;
    position: relative;
    margin: 28px 0 8px;
}

.progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(
        90deg,
        var(--color-primary),
        var(--color-accent)
    );
}

.progress-dots {
    display: flex;
    justify-content: space-between;
    position: absolute;
    top: -8px;
    width: 100%;
}

.progress-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 0 0 2px var(--color-primary);
    background: var(--color-primary);
}

.progress-dot.inactive {
    background: white;
    box-shadow: 0 0 0 2px #ccc;
}

.progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
}

.logistics-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
}

.logistics-stat {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.logistics-stat-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
}

.logistics-stat-value {
    font-size: 28px;
    font-weight: 700;
}

.logistics-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.logistics-toolbar-left {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.logistics-input,
.logistics-select {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    font-size: 14px;
    outline: none;
}

.logistics-input:focus,
.logistics-select:focus {
    border-color: var(--color-primary);
}

.shipment-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
}

.shipment-actions button {
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
}

.btn-status {
    background: var(--color-primary);
    color: white;
}

.btn-refresh {
    background: #f1f8f3;
    color: var(--color-primary);
}

.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
}

.empty-state i {
    width: 45px;
    height: 45px;
    margin-bottom: 12px;
}

.loading-state {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
}

.error-state {
    background: #fff3f3;
    color: #c0392b;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: none;
}

.status-select {
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background: white;
    font-size: 13px;
}

@media (max-width: 900px) {

    .logistics-stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .logistics-stats {
        grid-template-columns: 1fr;
    }

    .shipment-card {
        padding: 18px;
    }

    .progress-labels {
        font-size: 11px;
    }

}

</style>

</head>


<body>

<div class="dashboard-layout">

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">

                <i data-lucide="tractor"></i>

                AgriLink AI

            </div>

        </div>


        <nav class="nav-menu">

            <a
                href="dashboard-farmer.html"
                class="nav-item"
            >
                Overview
            </a>

            <a
                href="farmer-market-prices.html"
                class="nav-item"
            >
                Market Prices
            </a>

            <a
                href="farmer-produce.html"
                class="nav-item"
            >
                My Produce
            </a>

            <a
                href="farmer-offers.html"
                class="nav-item"
            >
                Buyer Offers
            </a>

            <a
                href="farmer-transactions.html"
                class="nav-item"
            >
                Transactions
            </a>

            <a
                href="farmer-logistics.html"
                class="nav-item active"
            >
                Logistics
            </a>

        </nav>


        <div class="sidebar-footer">

            <a
                href="index.html"

                id="logoutBtn"
                style="color:#e74c3c;padding:0;"
            >
                Log Out
            </a>

        </div>

    </aside>


    <!-- ================================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================================= -->

    <main class="main-content">


        <!-- ================================================= -->
        <!-- TOPBAR -->
        <!-- ================================================= -->

        <header class="topbar glass-panel">

            <h2 class="page-title">
                Logistics
            </h2>


            <div class="topbar-actions">

                <button
                    id="notifBtn"
                    class="btn-secondary"
                    style="
                        padding:8px 12px;
                        display:flex;
                        align-items:center;
                        gap:8px;
                    "
                >

                    <i
                        data-lucide="bell"
                        style="
                            width:16px;
                            height:16px;
                        "
                    ></i>

                    Notifications

                </button>


                <div class="user-profile">

                    <div
                        class="avatar"
                        id="userAvatar"
                    >
                        F
                    </div>

                    <span
                        id="userName"
                        style="font-weight:500;"
                    >
                        Farmer
                    </span>

                </div>

            </div>

        </header>


        <!-- ================================================= -->
        <!-- DASHBOARD CONTAINER -->
        <!-- ================================================= -->

        <div class="dashboard-container fade-in">


            <!-- ERROR -->
            <div
                id="errorBox"
                class="error-state"
            ></div>


            <!-- ================================================= -->
            <!-- STATISTICS -->
            <!-- ================================================= -->

            <div class="logistics-stats">


                <div class="logistics-stat">

                    <div class="logistics-stat-label">
                        Total Shipments
                    </div>

                    <div
                        class="logistics-stat-value"
                        id="totalShipments"
                    >
                        0
                    </div>

                </div>


                <div class="logistics-stat">

                    <div class="logistics-stat-label">
                        Pending
                    </div>

                    <div
                        class="logistics-stat-value"
                        id="pendingShipments"
                    >
                        0
                    </div>

                </div>


                <div class="logistics-stat">

                    <div class="logistics-stat-label">
                        In Transit
                    </div>

                    <div
                        class="logistics-stat-value"
                        id="transitShipments"
                    >
                        0
                    </div>

                </div>


                <div class="logistics-stat">

                    <div class="logistics-stat-label">
                        Delivered
                    </div>

                    <div
                        class="logistics-stat-value"
                        id="deliveredShipments"
                    >
                        0
                    </div>

                </div>


            </div>


            <!-- ================================================= -->
            <!-- ACTIVE SHIPMENTS -->

            <h3

                    font-family:'Outfit',sans-serif;
                    margin-bottom:16px;
                "

                Shipments
            </h3>


            <!-- TOOLBAR -->

            <div class="logistics-toolbar">

                <div class="logistics-toolbar-left">

                    <input

                    >


                    <select
                        id="statusFilter"

                    >

                        <option value="all">

                        </option>

                        <option value="pending">

                        <option value="picked_up">
                            Picked Up
                        </option>

                        <option value="in_transit">
                            In Transit
                        </option>

                        <option value="delivered">
                            Delivered
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled

                    </select>

                </div>


                <button

                        border:none;

            <!-- ================================================= -->

            <div id="shipmentList">

                Past Deliveries
            </h3>


            <div class="dashboard-section glass-panel">

                    "

                            <tr>

                                </th>

                                <th>
                                    Produce

                                </th>

                                    Status
                                </th>

                        </thead>


                        <tbody id="pastDeliveriesBody">

                            <tr>

                                <td

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_BASE =
    'http://localhost:5000';


/* =====================================================
   USER INFORMATION
===================================================== */

const farmerId =
    localStorage.getItem('agrilink_user_id');

const storedUser =
    localStorage.getItem('agrilink_user');

let farmerName =
    'Farmer';


try {

    if (storedUser) {

        const parsed =
            JSON.parse(storedUser);

        if (typeof parsed === 'string') {

            farmerName = parsed;

        } else if (parsed && parsed.name) {

            farmerName = parsed.name;

        }

    }

} catch (error) {

    if (storedUser) {

        farmerName = storedUser;

    }

}


document.getElementById(
    'userName'
).textContent = farmerName;


document.getElementById(
    'userAvatar'
).textContent =
    farmerName.charAt(0).toUpperCase();


/* =====================================================
   DATA
===================================================== */

let shipments = [];


/* =====================================================
   DOM ELEMENTS
===================================================== */

const shipmentList =
    document.getElementById(
        'shipmentList'
    );

const pastDeliveriesBody =
    document.getElementById(
        'pastDeliveriesBody'
    );

const searchInput =
    document.getElementById(
        'searchInput'
    );

const statusFilter =
    document.getElementById(
        'statusFilter'
    );

const errorBox =
    document.getElementById(
        'errorBox'
    );


/* =====================================================
   ERROR DISPLAY
===================================================== */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        'block';

}


function hideError() {

    errorBox.textContent =
        '';

    errorBox.style.display =
        'none';

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(dateValue) {

    if (!dateValue) {

        return '—';

    }

    const date =
        new Date(dateValue);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '—';

    }

    return date.toLocaleDateString(
        'en-IN',
        {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        }
    );

}


/* =====================================================
   STATUS TEXT
===================================================== */

function statusText(status) {

    if (!status) {

        return 'Unknown';

    }

    const value =
        String(status)
            .toLowerCase()
            .trim();


    const labels = {

        pending:
            'Pending',

        requested:
            'Requested',

        picked_up:
            'Picked Up',

        in_transit:
            'In Transit',

        delivered:
            'Delivered',

        completed:
            'Completed',

        cancelled:
            'Cancelled'

    };


    return labels[value] ||
        status;

}


/* =====================================================
   STATUS BADGE
===================================================== */

function statusBadge(status) {

    const value =
        String(status || '')
            .toLowerCase()
            .trim();


    if (
        value === 'delivered' ||
        value === 'completed'
    ) {

        return `
            <span class="badge badge-success">
                ${statusText(value)}
            </span>
        `;

    }


    if (
        value === 'in_transit' ||
        value === 'picked_up'
    ) {

        return `
            <span
                class="badge"
                style="
                    background:#fff3cd;
                    color:#856404;
                "
            >
                ${statusText(value)}
            </span>
        `;

    }


    if (
        value === 'cancelled'
    ) {

        return `
            <span
                class="badge"
                style="
                    background:#fdecea;
                    color:#c0392b;
                "
            >
                Cancelled
            </span>
        `;

    }


    return `
        <span class="badge badge-warning">
            ${statusText(value)}
        </span>
    `;

}


/* =====================================================
   PROGRESS
===================================================== */

function getProgress(status) {

    const value =
        String(status || '')
            .toLowerCase()
            .trim();


    if (
        value === 'completed' ||
        value === 'delivered'
    ) {

        return 100;

    }


    if (
        value === 'in_transit'
    ) {

        return 66;

    }


    if (
        value === 'picked_up'
    ) {

        return 33;

    }


    if (
        value === 'cancelled'
    ) {

        return 0;

    }


    return 10;

}


/* =====================================================
   RENDER PROGRESS
===================================================== */

function renderProgress(status) {

    const value =
        String(status || '')
            .toLowerCase()
            .trim();


    const progress =
        getProgress(value);


    let activeDots = 1;


    if (
        value === 'picked_up'
    ) {

        activeDots = 2;

    }


    if (
        value === 'in_transit'
    ) {

        activeDots = 2;

    }


    if (
        value === 'delivered' ||
        value === 'completed'
    ) {

        activeDots = 3;

    }


    return `

        <div class="progress-track">

            <div
                class="progress-fill"
                style="width:${progress}%"
            ></div>

            <div class="progress-dots">

                <div
                    class="progress-dot"
                ></div>

                <div
                    class="
                    progress-dot
                    ${activeDots >= 2 ? '' : 'inactive'}
                    "
                ></div>

                <div
                    class="
                    progress-dot
                    ${activeDots >= 3 ? '' : 'inactive'}
                    "
                ></div>

            </div>

        </div>


        <div
            class="progress-labels"
            style="margin-top:6px;"
        >

            <span>
                Dispatched
                <br>
                <strong>
                    ${formatDate(
                        shipmentsDate(
                            status,
                            'pickup'
                        )
                    )}
                </strong>
            </span>


            <span style="text-align:center;">

                In Transit

                <br>

                <strong>
                    ${
                        value === 'in_transit'
                            ? 'Active'
                            : '—'
                    }
                </strong>

            </span>


            <span style="text-align:right;">

                Delivery

                <br>

                <strong>
                    ${
                        value === 'delivered' ||
                        value === 'completed'
                            ? 'Delivered'
                            : 'Pending'
                    }
                </strong>

            </span>

        </div>

    `;

}


/* =====================================================
   HELPER DATE
===================================================== */

function shipmentsDate(
    status,
    type
) {

    const shipment =
        shipments.find(
            item =>
                String(
                    item.status
                ).toLowerCase() ===
                String(status).toLowerCase()
        );


    if (!shipment) {

        return null;

    }


    if (type === 'pickup') {

        return (
            shipment.pickup_date ||
            shipment.created_at
        );

    }


    return (
        shipment.expected_delivery_date
    );

}


/* =====================================================
   LOAD SHIPMENTS
===================================================== */

async function loadShipments() {

    hideError();


    if (!farmerId) {

        showError(
            'Farmer information not found. Please login again.'
        );

        shipmentList.innerHTML = `
            <div class="empty-state">

                <i data-lucide="user-x"></i>

                <h3>
                    Farmer session not found
                </h3>

                <p>
                    Please login again.
                </p>

            </div>
        `;

        lucide.createIcons();

        return;

    }


    shipmentList.innerHTML = `

        <div class="loading-state">

            Loading shipments...

        </div>

    `;


    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/logistics/${farmerId}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Failed to load logistics'
            );

        }


        shipments =
            Array.isArray(
                data.shipments
            )
                ? data.shipments
                : [];


        renderStats();

        renderShipments();

        renderPastDeliveries();

    } catch (error) {

        console.error(
            'Logistics loading error:',
            error
        );

        showError(
            error.message ||
            'Unable to load logistics'
        );


        shipmentList.innerHTML = `

            <div class="empty-state">

                <i data-lucide="truck"></i>

                <h3>
                    Unable to load shipments
                </h3>

                <p>
                    Please make sure the backend is running.
                </p>

            </div>

        `;

        lucide.createIcons();

    }

}


/* =====================================================
   LOAD STATISTICS
===================================================== */

async function loadStats() {

    if (!farmerId) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/logistics/${farmerId}/stats`
            );


        const data =
            await response.json();


        if (!response.ok) {

            return;

        }


        document.getElementById(
            'totalShipments'
        ).textContent =
            Number(data.total || 0);


        document.getElementById(
            'pendingShipments'
        ).textContent =
            Number(data.pending || 0);


        document.getElementById(
            'transitShipments'
        ).textContent =
            Number(data.in_transit || 0);


        document.getElementById(
            'deliveredShipments'
        ).textContent =
            Number(data.delivered || 0);

    } catch (error) {

        console.error(
            'Statistics error:',
            error
        );

    }

}


/* =====================================================
   RENDER STATISTICS
===================================================== */

function renderStats() {

    const total =
        shipments.length;


    const pending =
        shipments.filter(
            shipment =>
                [
                    'pending',
                    'requested'
                ].includes(
                    String(
                        shipment.status
                    ).toLowerCase()
                )
        ).length;


    const transit =
        shipments.filter(
            shipment =>
                [
                    'picked_up',
                    'in_transit'
                ].includes(
                    String(
                        shipment.status
                    ).toLowerCase()
                )
        ).length;


    const delivered =
        shipments.filter(
            shipment =>
                [
                    'delivered',
                    'completed'
                ].includes(
                    String(
                        shipment.status
                    ).toLowerCase()
                )
        ).length;


    document.getElementById(
        'totalShipments'
    ).textContent =
        total;


    document.getElementById(
        'pendingShipments'
    ).textContent =
        pending;


    document.getElementById(
        'transitShipments'
    ).textContent =
        transit;


    document.getElementById(
        'deliveredShipments'
    ).textContent =
        delivered;

}


/* =====================================================
   FILTER SHIPMENTS
===================================================== */

function getFilteredShipments() {

    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    const selectedStatus =
        statusFilter.value;


    return shipments.filter(
        shipment => {

            const buyer =
                String(
                    shipment.buyer_name || ''
                ).toLowerCase();


            const crop =
                String(
                    shipment.crop_name || ''
                ).toLowerCase();


            const status =
                String(
                    shipment.status || ''
                ).toLowerCase();


            const matchesSearch =
                !search ||
                buyer.includes(search) ||
                crop.includes(search);


            const matchesStatus =
                selectedStatus === 'all' ||
                status === selectedStatus;


            return (
                matchesSearch &&
                matchesStatus
            );

        }
    );

}


/* =====================================================
   RENDER SHIPMENTS
===================================================== */

function renderShipments() {

    const filtered =
        getFilteredShipments();


    if (filtered.length === 0) {

        shipmentList.innerHTML = `

            <div class="empty-state">

                <i data-lucide="truck"></i>

                <h3>
                    No shipments found
                </h3>

                <p>
                    Shipments will appear here when logistics are created.
                </p>

            </div>

        `;

        lucide.createIcons();

        return;

    }


    shipmentList.innerHTML =
        filtered.map(
            shipment =>
                createShipmentCard(
                    shipment
                )
        ).join('');


    lucide.createIcons();

}


/* =====================================================
   CREATE SHIPMENT CARD
===================================================== */

function createShipmentCard(
    shipment
) {

    const shipmentId =
        shipment.id
            ? `SHP-${shipment.id}`
            : 'Shipment';


    const crop =
        shipment.crop_name ||
        'Produce';


    const quantity =
        shipment.quantity ??
        shipment.transaction_quantity ??
        0;


    const unit =
        shipment.unit ||
        'kg';


    const buyer =
        shipment.buyer_name ||
        'Buyer';


    const pickupAddress =
        shipment.pickup_address ||
        'Not provided';


    const deliveryAddress =
        shipment.delivery_address ||
        'Not provided';


    const transporter =
        shipment.transporter ||
        'Not assigned';


    const trackingNumber =
        shipment.tracking_number ||
        'Not available';


    const status =
        String(
            shipment.status ||
            'pending'
        ).toLowerCase();


    const progress =
        getProgress(status);


    let activeDots = 1;


    if (
        status === 'picked_up' ||
        status === 'in_transit'
    ) {

        activeDots = 2;

    }


    if (
        status === 'delivered' ||
        status === 'completed'
    ) {

        activeDots = 3;

    }


    return `

        <div class="shipment-card">

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    margin-bottom:16px;
                    flex-wrap:wrap;
                    gap:8px;
                "
            >

                <div>

                    <h3
                        style="
                            margin-bottom:4px;
                        "
                    >
                        ${escapeHtml(
                            shipmentId
                        )}
                    </h3>

                    <p
                        style="
                            font-size:13px;
                            color:var(--text-muted);
                        "
                    >
                        ${escapeHtml(crop)}
                        (${escapeHtml(String(quantity))}
                        ${escapeHtml(unit)})
                        →
                        ${escapeHtml(buyer)}
                    </p>

                </div>


                ${statusBadge(status)}

            </div>


            <!-- PROGRESS -->

            <div class="progress-track">

                <div
                    class="progress-fill"
                    style="
                        width:${progress}%;
                    "
                ></div>


                <div class="progress-dots">

                    <div
                        class="progress-dot"
                    ></div>


                    <div
                        class="
                            progress-dot
                            ${
                                activeDots >= 2
                                    ? ''
                                    : 'inactive'
                            }
                        "
                    ></div>


                    <div
                        class="
                            progress-dot
                            ${
                                activeDots >= 3
                                    ? ''
                                    : 'inactive'
                            }
                        "
                    ></div>

                </div>

            </div>


            <div
                class="progress-labels"
                style="margin-top:6px;"
            >

                <span>

                    Dispatched

                    <br>

                    <strong>
                        ${
                            formatDate(
                                shipment.pickup_date ||
                                shipment.created_at
                            )
                        }
                    </strong>

                </span>


                <span
                    style="
                        text-align:center;
                    "
                >

                    In Transit

                    <br>

                    <strong>
                        ${
                            status === 'in_transit'
                                ? 'Active'
                                : '—'
                        }
                    </strong>

                </span>


                <span
                    style="
                        text-align:right;
                    "
                >

                    Delivery

                    <br>

                    <strong>
                        ${
                            shipment.expected_delivery_date
                                ? formatDate(
                                    shipment.expected_delivery_date
                                )
                                : '—'
                        }
                    </strong>

                </span>

            </div>


            <!-- DETAILS -->

            <div
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(3,1fr);
                    gap:12px;
                    margin-top:20px;
                    padding-top:16px;
                    border-top:1px solid #eee;
                "
            >

                <div>

                    <p
                        style="
                            font-size:12px;
                            color:var(--text-muted);
                        "
                    >
                        Pickup
                    </p>

                    <p
                        style="
                            font-weight:600;
                            font-size:13px;
                        "
                    >
                        ${escapeHtml(
                            pickupAddress
                        )}
                    </p>

                </div>


                <div>

                    <p
                        style="
                            font-size:12px;
                            color:var(--text-muted);
                        "
                    >
                        Delivery
                    </p>

                    <p
                        style="
                            font-weight:600;
                            font-size:13px;
                        "
                    >
                        ${escapeHtml(
                            deliveryAddress
                        )}
                    </p>

                </div>


                <div>

                    <p
                        style="
                            font-size:12px;
                            color:var(--text-muted);
                        "
                    >
                        Tracking
                    </p>

                    <p
                        style="
                            font-weight:600;
                            font-size:13px;
                        "
                    >
                        ${escapeHtml(
                            trackingNumber
                        )}
                    </p>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="shipment-actions">

                <select
                    class="status-select"
                    id="status-${shipment.id}"
                >

                    <option
                        value="pending"
                        ${
                            status === 'pending'
                                ? 'selected'
                                : ''
                        }
                    >
                        Pending
                    </option>


                    <option
                        value="picked_up"
                        ${
                            status === 'picked_up'
                                ? 'selected'
                                : ''
                        }
                    >
                        Picked Up
                    </option>


                    <option
                        value="in_transit"
                        ${
                            status === 'in_transit'
                                ? 'selected'
                                : ''
                        }
                    >
                        In Transit
                    </option>


                    <option
                        value="delivered"
                        ${
                            status === 'delivered'
                                ? 'selected'
                                : ''
                        }
                    >
                        Delivered
                    </option>


                    <option
                        value="completed"
                        ${
                            status === 'completed'
                                ? 'selected'
                                : ''
                        }
                    >
                        Completed
                    </option>


                    <option
                        value="cancelled"
                        ${
                            status === 'cancelled'
                                ? 'selected'
                                : ''
                        }
                    >
                        Cancelled
                    </option>

                </select>


                <button
                    class="btn-status"
                    onclick="
                        updateShipmentStatus(
                            ${shipment.id}
                        )
                    "
                >

                    Update Status

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   UPDATE SHIPMENT STATUS
===================================================== */

async function updateShipmentStatus(
    shipmentId
) {

    const select =
        document.getElementById(
            `status-${shipmentId}`
        );


    if (!select) {

        return;

    }


    const newStatus =
        select.value;


    if (!farmerId) {

        alert(
            'Farmer session not found.'
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/farmer/logistics/${shipmentId}/status`,
                {
                    method:
                        'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            farmerId:
                                Number(farmerId),

                            status:
                                newStatus
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Failed to update shipment status'
            );

        }


        alert(
            'Shipment status updated successfully.'
        );


        await loadShipments();

        await loadStats();

    } catch (error) {

        console.error(
            'Status update error:',
            error
        );

        alert(
            error.message ||
            'Failed to update shipment status'
        );

    }

}


/* =====================================================
   PAST DELIVERIES
===================================================== */

function renderPastDeliveries() {

    const past =
        shipments.filter(
            shipment => {

                const status =
                    String(
                        shipment.status || ''
                    ).toLowerCase();


                return (
                    status === 'delivered' ||
                    status === 'completed'
                );

            }
        );


    if (past.length === 0) {

        pastDeliveriesBody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="
                        text-align:center;
                        padding:30px;
                    "
                >
                    No past deliveries
                </td>

            </tr>

        `;

        return;

    }


    pastDeliveriesBody.innerHTML =
        past.map(
            shipment => {

                const shipmentId =
                    shipment.id
                        ? `SHP-${shipment.id}`
                        : '—';


                const buyer =
                    shipment.buyer_name ||
                    'Buyer';


                const crop =
                    shipment.crop_name ||
                    'Produce';


                const quantity =
                    shipment.quantity ??
                    shipment.transaction_quantity ??
                    0;


                const unit =
                    shipment.unit ||
                    'kg';


                const deliveredDate =
                    shipment.actual_delivery_date ||
                    shipment.delivered_at ||
                    shipment.updated_at ||
                    shipment.expected_delivery_date;


                return `

                    <tr>

                        <td>
                            ${escapeHtml(
                                shipmentId
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                buyer
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                crop
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                String(quantity)
                            )}
                            ${escapeHtml(
                                unit
                            )}
                        </td>


                        <td>
                            ${escapeHtml(
                                formatDate(
                                    deliveredDate
                                )
                            )}
                        </td>


                        <td>
                            ${statusBadge(
                                shipment.status
                            )}
                        </td>

                    </tr>

                `;

            }
        ).join('');

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(value ?? '')
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}
