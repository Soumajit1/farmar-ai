<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Member Farmers — FPO — AgriLink AI</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="stylesheet"
    href="css/dashboards.css"
>

<script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>


<div class="dashboard-layout">


    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">

                <i data-lucide="tractor"></i>

                AgriLink AI

            </div>

        </div>


        <nav class="nav-menu">

            <a
                href="dashboard-fpo.html"
                class="nav-item"
            >
                FPO Overview
            </a>

            <a
                href="fpo-members.html"
                class="nav-item active"
            >
                Member Farmers
            </a>

            <a
                href="fpo-inventory.html"
                class="nav-item"
            >
                Aggregated Produce
            </a>

            <a
                href="fpo-buyers.html"
                class="nav-item"
            >
                Buyer Connections
            </a>

            <a
                href="fpo-transactions.html"
                class="nav-item"
            >
                Transactions
            </a>

            <a
                href="fpo-analytics.html"
                class="nav-item"
            >
                Analytics
            </a>

        </nav>


        <div class="sidebar-footer">

            <a
                href="index.html"
                class="nav-item"
                style="
                    color:#e74c3c;
                    padding:0;
                "
            >
                Log Out
            </a>

        </div>

    </aside>



    <main class="main-content">


        <header class="topbar glass-panel">

            <h2 class="page-title">
                Member Farmers
            </h2>


            <div class="user-profile">

                <div
                    class="avatar"
                    id="userAvatar"
                >
                    F
                </div>

                <span
                    id="userName"
                    style="font-weight:500;"
                >
                    FPO Admin
                </span>

            </div>

        </header>



        <div class="dashboard-container fade-in">


            <!-- STATISTICS -->

            <div
                class="grid-cards"
                style="margin-bottom:24px;"
            >

                <div class="card-3d stat-card">

                    <div class="stat-header">
                        <span>Total Members</span>
                    </div>

                    <div class="stat-value">
                        0
                    </div>

                </div>


                <div class="card-3d stat-card">

                    <div class="stat-header">
                        <span>Active</span>
                    </div>

                    <div
                        class="stat-value"
                        style="color:var(--color-accent);"
                    >
                        0
                    </div>

                </div>


                <div class="card-3d stat-card">

                    <div class="stat-header">
                        <span>Inactive</span>
                    </div>

                    <div
                        class="stat-value"
                        style="color:#e74c3c;"
                    >
                        0
                    </div>

                </div>

            </div>



            <!-- SEARCH -->

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    margin-bottom:20px;
                    flex-wrap:wrap;
                    gap:12px;
                "
            >

                <input
                    id="memberSearch"
                    type="text"
                    placeholder="Search member..."
                    style="
                        padding:10px 14px;
                        border:1px solid #e0e0e0;
                        border-radius:8px;
                        flex:1;
                        min-width:200px;
                    "
                >

            </div>



            <!-- TABLE -->

            <div class="dashboard-section glass-panel">

                <div class="section-title">

                    Member Directory

                </div>


                <table class="data-table">

                    <thead>

                        <tr>

                            <th>Member ID</th>

                            <th>Name</th>

                            <th>Location</th>

                            <th>Land</th>

                            <th>Produce Listings</th>

                            <th>Email</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <td colspan="8"
                                style="
                                    text-align:center;
                                    color:var(--text-muted);
                                "
                            >

                                Loading members...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


        </div>

    </main>

</div>



<script
    src="js/fpo.js?v=1"
></script>


<script>

if (window.lucide) {
    lucide.createIcons();
}

</script>


</body>

</html>
