<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FPO Dashboard — AgriLink AI</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="stylesheet"
    href="css/dashboards.css"
>

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<div class="dashboard-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">

                <i data-lucide="tractor"></i>

                AgriLink AI

            </div>

        </div>


        <nav class="nav-menu">

            <a
                href="dashboard-fpo.html"
                class="nav-item active"
            >
                FPO Overview
            </a>

            <a
                href="fpo-members.html"
                class="nav-item"
            >
                Member Farmers
            </a>

            <a
                href="fpo-inventory.html"
                class="nav-item"
            >
                Aggregated Produce
            </a>

            <a
                href="fpo-buyers.html"
                class="nav-item"
            >
                Buyer Connections
            </a>

            <a
                href="fpo-transactions.html"
                class="nav-item"
            >
                Transactions
            </a>

            <a
                href="fpo-analytics.html"
                class="nav-item"
            >
                Analytics
            </a>

        </nav>


        <div class="sidebar-footer">

            <a
                href="index.html"
                class="nav-item"
                style="
                    color:#e74c3c;
                    padding:0;
                "
            >
                Log Out
            </a>

        </div>

    </aside>



    <!-- MAIN -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar glass-panel">

            <h2 class="page-title">
                FPO Overview
            </h2>


            <div class="topbar-actions">

                <div class="user-profile">

                    <div
                        class="avatar"
                        id="userAvatar"
                    >
                        F
                    </div>

                    <span
                        id="userName"
                        style="font-weight:500;"
                    >
                        FPO Admin
                    </span>

                </div>

            </div>

        </header>



        <!-- CONTENT -->

        <div class="dashboard-container fade-in">


            <!-- STATISTICS -->

            <div class="grid-cards">


                <div class="card-3d stat-card">

                    <div class="stat-header">

                        <span>
                            Total Members
                        </span>

                        <span class="trend-up">
                            Live
                        </span>

                    </div>


                    <div class="stat-value">
                        0
                    </div>

                </div>



                <div class="card-3d stat-card">

                    <div class="stat-header">

                        <span>
                            Aggregated Volume
                        </span>

                        <span class="trend-up">
                            Live
                        </span>

                    </div>


                    <div class="stat-value">

                        0

                        <span
                            style="
                                font-size:16px;
                                color:var(--text-muted);
                            "
                        >
                            units
                        </span>

                    </div>

                </div>



                <div class="card-3d stat-card">

                    <div class="stat-header">

                        <span>
                            Active Buyer Contracts
                        </span>

                        <span
                            style="
                                color:var(--color-primary);
                            "
                        >
                            Live
                        </span>

                    </div>


                    <div class="stat-value">
                        0
                    </div>

                </div>


            </div>



            <!-- CHART + ACTIVITY -->

            <div
                style="
                    display:flex;
                    gap:24px;
                    flex-wrap:wrap;
                "
            >


                <!-- CHART -->

                <div
                    class="dashboard-section card-3d"
                    style="
                        flex:2;
                        min-width:300px;
                    "
                >

                    <div class="section-title">

                        Aggregated Sales vs Volume

                    </div>


                    <canvas
                        id="salesChart"
                        height="200"
                    ></canvas>

                </div>



                <!-- RECENT ACTIVITY -->

                <div
                    class="dashboard-section card-3d"
                    style="
                        flex:1;
                        min-width:250px;
                    "
                >

                    <div class="section-title">

                        Recent Member Deposits

                    </div>


                    <div
                        style="
                            display:flex;
                            flex-direction:column;
                            gap:12px;
                        "
                    >

                        <div
                            id="recentMembersLoading"
                            style="
                                color:var(--text-muted);
                                font-size:14px;
                                padding:20px;
                                text-align:center;
                            "
                        >

                            Loading...

                        </div>


                        <a
                            href="fpo-members.html"
                            class="btn-secondary"
                            style="
                                width:100%;
                                margin-top:8px;
                                text-align:center;
                                text-decoration:none;
                            "
                        >
                            View All Members
                        </a>

                    </div>

                </div>

            </div>


        </div>

    </main>

</div>



<!-- FPO JAVASCRIPT -->

<script
    src="js/fpo.js?v=1"
></script>


<script>

if (window.lucide) {
    lucide.createIcons();
}

</script>


</body>

</html>
