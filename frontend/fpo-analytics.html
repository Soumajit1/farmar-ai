<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Analytics — FPO — AgriLink AI</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="stylesheet"
    href="css/dashboards.css"
>

<script src="https://unpkg.com/lucide@latest"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


<div class="dashboard-layout">


    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="sidebar-logo">

                <i data-lucide="tractor"></i>

                AgriLink AI

            </div>

        </div>


        <nav class="nav-menu">

            <a
                href="dashboard-fpo.html"
                class="nav-item"
            >
                FPO Overview
            </a>

            <a
                href="fpo-members.html"
                class="nav-item"
            >
                Member Farmers
            </a>

            <a
                href="fpo-inventory.html"
                class="nav-item"
            >
                Aggregated Produce
            </a>

            <a
                href="fpo-buyers.html"
                class="nav-item"
            >
                Buyer Connections
            </a>

            <a
                href="fpo-transactions.html"
                class="nav-item"
            >
                Transactions
            </a>

            <a
                href="fpo-analytics.html"
                class="nav-item active"
            >
                Analytics
            </a>

        </nav>


        <div class="sidebar-footer">

            <a
                href="index.html"
                class="nav-item"
                style="
                    color:#e74c3c;
                    padding:0;
                "
            >
                Log Out
            </a>

        </div>

    </aside>



    <main class="main-content">


        <header class="topbar glass-panel">

            <h2 class="page-title">
                Analytics
            </h2>


            <div class="user-profile">

                <div
                    class="avatar"
                    id="userAvatar"
                >
                    F
                </div>

                <span
                    id="userName"
                    style="font-weight:500;"
                >
                    FPO Admin
                </span>

            </div>

        </header>



        <div class="dashboard-container fade-in">


            <div
                style="
                    display:flex;
                    gap:24px;
                    flex-wrap:wrap;
                "
            >


                <div
                    class="dashboard-section card-3d"
                    style="
                        flex:1;
                        min-width:300px;
                    "
                >

                    <div class="section-title">

                        Monthly Revenue Trend

                    </div>


                    <canvas
                        id="revenueChart"
                        height="200"
                    ></canvas>

                </div>



                <div
                    class="dashboard-section card-3d"
                    style="
                        flex:1;
                        min-width:300px;
                    "
                >

                    <div class="section-title">

                        Crop Volume

                    </div>


                    <canvas
                        id="cropChart"
                        height="200"
                    ></canvas>

                </div>


            </div>



            <div
                class="dashboard-section glass-panel"
                style="margin-top:24px;"
            >

                <div class="section-title">

                    Performance Metrics

                </div>


                <table class="data-table">

                    <thead>

                        <tr>

                            <th>Metric</th>

                            <th>Value</th>

                            <th>Target</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <td colspan="4"
                                style="
                                    text-align:center;
                                    color:var(--text-muted);
                                "
                            >

                                Loading analytics...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


        </div>

    </main>

</div>



<script
    src="js/fpo.js?v=1"
></script>


<script>

if (window.lucide) {
    lucide.createIcons();
}

</script>


</body>

</html>
